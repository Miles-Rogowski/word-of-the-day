<!DOCTYPE html>
<html>
    <head>
        <title>Word of the day</title>
        <link rel="stylesheet" type="text/css" href="./style.css">
    </head>
    <body>
        <main>
            <h1>word of the day:</h1>
            <h2 id="word"></h2>
            <div id = "definitions"></div>
        </main>
    </body>
    <script>
        const path = "./words_alpha.txt";
        const word_container = document.getElementById("word");
        const definitions = document.getElementById("definitions");
        let date = new Date();
        // Source - https://stackoverflow.com/a/47593316
        // Posted by bryc, modified by community. See post 'Timeline' for change history
        // Retrieved 2026-10-10, License - CC BY-SA 4.0

        var seed = parseInt((date.getUTCDate().toString() + (date.getUTCFullYear()).toString() + (date.getUTCMonth() + 1).toString()));
        const prng = splitmix32(seed)


        fetch(path)
        .then(response=>response.text())
        .then(raw => {
            raw = raw.split("\n");
            let word_num = Math.floor(prng() * raw.length);
            let word = raw[word_num];
            word_container.textContent = word;

            fetch(`https://freedictionaryapi.com/api/v1/entries/en/${word}`)
            .then(response=>response.json())
            .then(data => {
                for(let entry of data.entries){
                    let header = document.createElement("h3");
                    definitions.appendChild(header);
                    header.textContent = entry.partOfSpeech;
                    for(let sense of entry.senses){
                        let text = document.createElement("p");
                        definitions.appendChild(text);
                        text.textContent = sense.definition;
                    }
                }
            });
        });

        // Source - https://stackoverflow.com/a/47593316
        // Posted by bryc, modified by community. See post 'Timeline' for change history
        // Retrieved 2026-10-10, License - CC BY-SA 4.0

        function cyrb128(str) {
            let h1 = 1779033703, h2 = 3144134277,
                h3 = 1013904242, h4 = 2773480762;
            for (let i = 0, k; i < str.length; i++) {
                k = str.charCodeAt(i);
                h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
                h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
                h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
                h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
            }
            h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
            h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
            h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
            h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
            h1 ^= (h2 ^ h3 ^ h4), h2 ^= h1, h3 ^= h1, h4 ^= h1;
            return [h1>>>0, h2>>>0, h3>>>0, h4>>>0];
        }
        // Side note: Only designed & tested for seed generation,
        // may be suboptimal as a general 128-bit hash.

        // Source - https://stackoverflow.com/a/47593316
        // Posted by bryc, modified by community. See post 'Timeline' for change history
        // Retrieved 2026-10-10, License - CC BY-SA 4.0

        function splitmix32(a) {
            return function() {
            a |= 0;
            a = a + 0x9e3779b9 | 0;
            let t = a ^ a >>> 16;
            t = Math.imul(t, 0x21f0aaad);
            t = t ^ t >>> 15;
            t = Math.imul(t, 0x735a2d97);
            return ((t = t ^ t >>> 15) >>> 0) / 4294967296;
            }
        }

        
        
    </script>
</html>
